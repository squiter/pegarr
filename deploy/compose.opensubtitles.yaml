services:
  pegarr:
    environment:
      PEGARR_OPENSUBTITLES_URL: ${PEGARR_OPENSUBTITLES_URL:-https://api.opensubtitles.com/api/v1}
      PEGARR_OPENSUBTITLES_ALLOWED_HOSTS: ${PEGARR_OPENSUBTITLES_ALLOWED_HOSTS:-api.opensubtitles.com}
      PEGARR_OPENSUBTITLES_API_KEY_FILE: /run/secrets/opensubtitles_api_key
      PEGARR_OPENSUBTITLES_INSTANCE_ID: ${PEGARR_OPENSUBTITLES_INSTANCE_ID:-opensubtitles}
      PEGARR_OPENSUBTITLES_ALLOW_INSECURE_HTTP: ${PEGARR_OPENSUBTITLES_ALLOW_INSECURE_HTTP:-false}
      PEGARR_OPENSUBTITLES_LANGUAGE_MAPPINGS: ${PEGARR_OPENSUBTITLES_LANGUAGE_MAPPINGS:-}
      PEGARR_OPENSUBTITLES_PROBE_KIND: ${PEGARR_OPENSUBTITLES_PROBE_KIND:-}
      PEGARR_OPENSUBTITLES_PROBE_IMDB_ID: ${PEGARR_OPENSUBTITLES_PROBE_IMDB_ID:-}
      PEGARR_OPENSUBTITLES_PROBE_TMDB_ID: ${PEGARR_OPENSUBTITLES_PROBE_TMDB_ID:-}
      PEGARR_OPENSUBTITLES_PROBE_POLICY_LANGUAGE: ${PEGARR_OPENSUBTITLES_PROBE_POLICY_LANGUAGE:-}
      PEGARR_OPENSUBTITLES_PROBE_PROVIDER_LANGUAGE: ${PEGARR_OPENSUBTITLES_PROBE_PROVIDER_LANGUAGE:-}
      PEGARR_OPENSUBTITLES_PROBE_SEASON: ${PEGARR_OPENSUBTITLES_PROBE_SEASON:-}
      PEGARR_OPENSUBTITLES_PROBE_EPISODE: ${PEGARR_OPENSUBTITLES_PROBE_EPISODE:-}
    secrets:
      - opensubtitles_api_key

secrets:
  opensubtitles_api_key:
    file: ${PEGARR_OPENSUBTITLES_API_KEY_HOST_FILE:?set an absolute PEGARR_OPENSUBTITLES_API_KEY_HOST_FILE}
