services:
  pegarr:
    environment:
      PEGARR_SUBDL_URL: ${PEGARR_SUBDL_URL:?set PEGARR_SUBDL_URL}
      PEGARR_SUBDL_ALLOWED_HOSTS: ${PEGARR_SUBDL_ALLOWED_HOSTS:?set PEGARR_SUBDL_ALLOWED_HOSTS}
      PEGARR_SUBDL_API_KEY_FILE: /run/secrets/subdl_api_key
      PEGARR_SUBDL_INSTANCE_ID: ${PEGARR_SUBDL_INSTANCE_ID:-subdl}
      PEGARR_SUBDL_ALLOW_INSECURE_HTTP: ${PEGARR_SUBDL_ALLOW_INSECURE_HTTP:-false}
      PEGARR_SUBDL_PROBE_KIND: ${PEGARR_SUBDL_PROBE_KIND:-}
      PEGARR_SUBDL_PROBE_IMDB_ID: ${PEGARR_SUBDL_PROBE_IMDB_ID:-}
      PEGARR_SUBDL_PROBE_TMDB_ID: ${PEGARR_SUBDL_PROBE_TMDB_ID:-}
      PEGARR_SUBDL_PROBE_POLICY_LANGUAGE: ${PEGARR_SUBDL_PROBE_POLICY_LANGUAGE:-}
      PEGARR_SUBDL_PROBE_PROVIDER_LANGUAGE: ${PEGARR_SUBDL_PROBE_PROVIDER_LANGUAGE:-}
      PEGARR_SUBDL_PROBE_SEASON: ${PEGARR_SUBDL_PROBE_SEASON:-}
      PEGARR_SUBDL_PROBE_EPISODE: ${PEGARR_SUBDL_PROBE_EPISODE:-}
    secrets:
      - subdl_api_key

secrets:
  subdl_api_key:
    file: ${PEGARR_SUBDL_API_KEY_HOST_FILE:?set an absolute PEGARR_SUBDL_API_KEY_HOST_FILE}
