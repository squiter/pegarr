services:
  pegarr:
    environment:
      PEGARR_ACCESS_TOKEN_FILE: /run/secrets/pegarr_access_token
      PEGARR_MISSING_PAGE_SIZE: ${PEGARR_MISSING_PAGE_SIZE:-50}
    secrets:
      - pegarr_access_token

secrets:
  pegarr_access_token:
    file: ${PEGARR_ACCESS_TOKEN_HOST_FILE:?set an absolute PEGARR_ACCESS_TOKEN_HOST_FILE}
