services:
  pegarr:
    image: ${PEGARR_IMAGE:-ghcr.io/squiter/pegarr:latest}
    environment:
      DATA_DIR: /data
      PEGARR_PROVIDER_CACHE_FILE: /data/provider-search-cache.sqlite
      PEGARR_PROVIDER_CACHE_POSITIVE_TTL_SECONDS: ${PEGARR_PROVIDER_CACHE_POSITIVE_TTL_SECONDS:-86400}
      PEGARR_PROVIDER_CACHE_EMPTY_TTL_SECONDS: ${PEGARR_PROVIDER_CACHE_EMPTY_TTL_SECONDS:-900}
      PEGARR_PROVIDER_CACHE_MAX_ENTRIES: ${PEGARR_PROVIDER_CACHE_MAX_ENTRIES:-5000}
      PORT: 8080
      TZ: ${TZ:-UTC}
    ports:
      - "${PEGARR_PORT:-8080}:8080"
    volumes:
      - pegarr-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pegarr-data:
