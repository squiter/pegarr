services:
  pegarr:
    image: ${PEGARR_IMAGE:-ghcr.io/squiter/pegarr:latest}
    environment:
      DATA_DIR: /data
      PORT: 8080
      TZ: ${TZ:-UTC}
    ports:
      - "${PEGARR_PORT:-8080}:8080"
    volumes:
      - pegarr-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pegarr-data:
